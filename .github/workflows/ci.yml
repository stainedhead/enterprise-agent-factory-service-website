name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 caches the packageManager's store by default, which needs pnpm on PATH
          # before corepack has enabled it. Turn that off; corepack provides pnpm below.
          package-manager-cache: false
      - name: Enable pnpm (version from packageManager)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint and format (Biome)
        run: pnpm lint
      - name: Type-check (tsc 7)
        run: pnpm typecheck
      - name: Test (Vitest)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high
