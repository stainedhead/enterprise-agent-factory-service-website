name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Bun is the runtime and package manager (ADR-004). Version from packageManager in package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # frozen install, contract:check, lint, typecheck, test:cover, build (size and tsdoc join in M0-P/W)
      - name: Gate
        run: bun run gate
      - name: Audit dependencies
        run: bun run audit

  sdk-runtime-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: SDK on Node 22
        run: bun run --filter '@afs/sdk' test:node
      - name: SDK on Bun
        run: bun run --filter '@afs/sdk' test:bun
      - name: SDK in Chromium
        run: |
          bunx playwright@1.63.0 install --with-deps chromium
          bun run --filter '@afs/sdk' test:browser

  e2e:
    runs-on: ubuntu-latest
    # Same image on every run so fonts and antialiasing match the committed baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      env:
        HOME: /root
    permissions:
      contents: write # only used by the [regen-baselines] path below
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 2
      - name: Detect baseline regeneration request
        id: regen
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" = "pull_request" ] && git log -1 --format=%B | grep -qF "[regen-baselines]"; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm install -g bun@1.4.4
      - run: bun install --frozen-lockfile
      - name: Regenerate chromium baselines in this image and commit them
        if: steps.regen.outputs.on == 'true'
        working-directory: apps/console
        run: |
          bunx playwright test --project=chromium --grep "visual:" --update-snapshots || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'e2e/specs/**/*-snapshots/*.png'
          if git diff --cached --quiet; then echo "no baseline changed"; else
            git commit -m "test(console): regenerate chromium visual baselines in the Playwright 1.63.0 image (specs/archive/261121-website-feature-complete)"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Playwright (chromium full; firefox and webkit smoke)
        if: steps.regen.outputs.on != 'true'
        run: bun run --filter '@afs/console' e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/console/playwright-report
            apps/console/e2e/visual/report
            apps/console/test-results
