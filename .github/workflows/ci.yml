name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Bun is the runtime and package manager (ADR-004). Version from packageManager in package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # frozen install, contract:check, lint, typecheck, test:cover, build (size and tsdoc join in M0-P/W)
      - name: Gate
        run: bun run gate
      - name: Audit dependencies
        run: bun run audit

  sdk-runtime-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: SDK on Node 22
        run: bun run --filter '@afs/sdk' test:node
      - name: SDK on Bun
        run: bun run --filter '@afs/sdk' test:bun
      - name: SDK in Chromium
        run: |
          bunx playwright@1.63.0 install --with-deps chromium
          bun run --filter '@afs/sdk' test:browser

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bunx playwright@1.63.0 install --with-deps chromium firefox webkit
      - name: Playwright (chromium full; firefox and webkit smoke)
        run: bun run --filter '@afs/console' e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            apps/console/playwright-report
            apps/console/e2e/visual/report
            apps/console/test-results
