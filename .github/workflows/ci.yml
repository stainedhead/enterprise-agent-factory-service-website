name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Bun is the runtime and package manager (ADR-004). Version from packageManager in package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Node stays available as the fallback runtime for tools that do not yet run on Bun.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint and format (Biome)
        run: bun run lint
      - name: Type-check (tsc 7)
        run: bun run typecheck
      - name: Test (Vitest)
        run: bun run test
      - name: Build
        run: bun run build
      - name: Audit dependencies
        run: bun run audit
