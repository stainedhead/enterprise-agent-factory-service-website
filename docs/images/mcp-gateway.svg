arker><marker id="arrow-neutral-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5f6b7a"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d13212"/></marker><marker id="arrow-danger-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d13212"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker><marker id="arrow-dark-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#232f3e"/></marker></defs><rect width="1400" height="1120" fill="#ffffff"/><rect x="0" y="0" width="1400" height="6" fill="#ff9900"/><text x="32" y="44" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#16191f">Governed MCP servers</text><text x="32" y="68" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5f6b7a">Agents reach MCP servers only through the team gateway. It admits each call against the approved catalog and the team and agent policy, then calls the server with credentials the agent never holds.</text><line x1="141" y1="158" x2="141" y2="1076" stroke="#aab7b8" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="363" y1="158" x2="363" y2="1076" stroke="#aab7b8" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="585" y1="158" x2="585" y2="1076" stroke="#aab7b8" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="807" y1="158" x2="807" y2="1076" stroke="#aab7b8" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="1029" y1="158" x2="1029" y2="1076" stroke="#aab7b8" stroke-width="1.4" stroke-dasharray=