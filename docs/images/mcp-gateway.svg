mily="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">RFC 8693 exchange of the projected token, or refresh</text><circle cx="341" cy="614" r="11" fill="#ec7211"/><text x="341" y="618.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">7</text><text x="696" y="651" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">short-lived access token</text><circle cx="1051" cy="658" r="11" fill="#7d3cff"/><text x="1051" y="662.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">8</text><text x="585" y="709" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">tools/call create_issue + credential</text><circle cx="341" cy="716" r="11" fill="#ec7211"/><text x="341" y="720.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">9</text><text x="585" y="753" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">result</text><circle cx="829" cy="760" r="11" fill="#5f6b7a"/><text x="829" y="764.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">10</text><text x="474" y="797" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#232f3e">mcp_events ledger row (batched, fails open)</text><circle cx="341" cy="804" r="11" fill="#ec7211"/><text x="341" y="808.5" text-anchor="middle" fo