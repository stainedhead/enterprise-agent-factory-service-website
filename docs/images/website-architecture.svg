<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-label="-website: console and SDK"><title>-website: console and SDK</title><defs><marker id="arrow-client" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0972d3"/></marker><marker id="arrow-client-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0972d3"/></marker><marker id="arrow-api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ec7211"/></marker><marker id="arrow-api-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#ec7211"/></marker><marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d8102"/></marker><marker id="arrow-data-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#1d8102"/></marker><marker id="arrow-aws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d3cff"/></marker><marker id="arrow-aws-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7d3cff"/></marker><marker id="arrow-k8s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#326ce5"/></marker><marker id="arrow-k8s-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#326ce5"/></marker><marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="arrow-neutral-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#5f6b7a"/></marker><marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d13212"/></marker><marker id="arrow-danger-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#d13212"/></marker><marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/></marker><marker id="arrow-dark-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#232f3e"/></marker></defs><rect width="1400" height="660" fill="#ffffff"/><rect x="0" y="0" width="1400" height="6" fill="#ff9900"/><text x="32" y="44" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#16191f">-website: console and SDK</text><text x="32" y="68" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#5f6b7a">The console is layered so React never talks to the API directly. The SDK is generated from the same OpenAPI contract as the CLI.</text><g><rect x="30" y="100" width="820" height="520" rx="14" fill="#f1f7fe" fill-opacity="0.55" stroke="#0972d3" stroke-width="1.4" /><text x="46" y="124" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0972d3" letter-spacing="0.6">@AFS/CONSOLE (APPS/CONSOLE)</text></g><g><rect x="890" y="100" width="480" height="520" rx="14" fill="#fff6e8" fill-opacity="0.55" stroke="#ec7211" stroke-width="1.4" /><text x="906" y="124" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ec7211" letter-spacing="0.6">@AFS/SDK (PACKAGES/SDK)</text><text x="906" y="141" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5f6b7a">published as @stainedhead/afs-sdk</text></g><polyline points="240,359 240,400" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="240,465 240.12,510" fill="none" stroke="#0972d3" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-client)" /><polyline points="640,359 640,432.5 420,432.5" fill="none" stroke="#5f6b7a" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-neutral)" /><rect x="492.375" y="422" width="75.25" height="21" rx="4" fill="#ffffff" stroke="#5f6b7a" stroke-opacity="0.35"/><text x="530" y="437" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">implements</text><polyline points="300.15999999999997,215 300.15999999999997,237.5 240,237.5 240,260" fill="none" stroke="#5f6b7a" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-neutral)" /><polyline points="699.92,215 699.92,237.5 640,237.5 640,260" fill="none" stroke="#5f6b7a" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-neutral)" /><polyline points="1130,242 1130,270" fill="none" stroke="#1d8102" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-data)" /><rect x="1101.8625" y="245.5" width="56.275000000000006" height="21" rx="4" fill="#ffffff" stroke="#1d8102" stroke-opacity="0.35"/><text x="1130" y="260.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">codegen</text><polyline points="1130,335 1130,370" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-api)" /><polyline points="1130,452 1130,490" fill="none" stroke="#ec7211" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-api)" /><polyline points="820,309.5 867.5,309.5 867.5,302.5 915,302.5" fill="none" stroke="#5f6b7a" stroke-width="1.7" stroke-linejoin="round"  marker-end="url(#arrow-neutral)" /><rect x="821.9375" y="299" width="43.625" height="21" rx="4" fill="#ffffff" stroke="#5f6b7a" stroke-opacity="0.35"/><text x="843.75" y="314" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#232f3e">calls</text><g><rect x="60" y="150" width="760" height="65" rx="10" fill="#232f3e" stroke="#232f3e" stroke-width="1.6"/><rect x="60" y="150" width="5" height="65" rx="2" fill="#232f3e" opacity="0"/><text x="440" y="179" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">main/: composition root</text><text x="440" y="198" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#d5dbdb">builds adapters, wires use cases, renders the app</text></g><g><rect x="60" y="260" width="360" height="99" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="60" y="260" width="5" height="99" rx="2" fill="#0972d3" opacity="0.9"/><text x="240" y="289" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">presentation/</text><text x="240" y="308" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">React 19 screens, shell, routes</text><text x="240" y="325" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">TanStack Query around use cases</text><text x="240" y="342" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">controls gated by can(…)</text></g><g><rect x="60" y="400" width="360" height="65" rx="10" fill="#f1f7fe" stroke="#0972d3" stroke-width="1.6"/><rect x="60" y="400" width="5" height="65" rx="2" fill="#0972d3" opacity="0.9"/><text x="240" y="429" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#033160">application/</text><text x="240" y="448" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">use cases and ports</text></g><g><rect x="60" y="510" width="760" height="65" rx="10" fill="#eef8ee" stroke="#1d8102" stroke-width="1.6"/><rect x="60" y="510" width="5" height="65" rx="2" fill="#1d8102" opacity="0.9"/><text x="440" y="539" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b3d00">domain/</text><text x="440" y="558" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">entities, value objects, permission policy mirroring internal/authz</text></g><g><rect x="460" y="260" width="360" height="99" rx="10" fill="#f6f7f8" stroke="#5f6b7a" stroke-width="1.6"/><rect x="460" y="260" width="5" height="99" rx="2" fill="#5f6b7a" opacity="0.9"/><text x="640" y="289" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#232f3e">infrastructure/</text><text x="640" y="308" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">adapters implement the ports:</text><text x="640" y="325" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">@afs/sdk, OIDC session (memory</text><text x="640" y="342" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">only), runtime config.json</text></g><g><rect x="915" y="160" width="430" height="82" rx="10" fill="#eef8ee" stroke="#1d8102" stroke-width="1.6"/><rect x="915" y="160" width="5" height="82" rx="2" fill="#1d8102" opacity="0.9"/><text x="1130" y="189" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0b3d00">contract/</text><text x="1130" y="208" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">pinned openapi.yaml, permissions.json</text><text x="1130" y="225" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">operations.json, contract.lock.json</text></g><g><rect x="915" y="270" width="430" height="65" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="915" y="270" width="5" height="65" rx="2" fill="#ec7211" opacity="0.9"/><text x="1130" y="299" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">src/generated/</text><text x="1130" y="318" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">182 operations in 41 resource modules</text></g><g><rect x="915" y="370" width="430" height="82" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="915" y="370" width="5" height="82" rx="2" fill="#ec7211" opacity="0.9"/><text x="1130" y="399" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">src/core/</text><text x="1130" y="418" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">transport, auth, retry, idempotency,</text><text x="1130" y="435" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">async-iterator pagination, AfsError</text></g><g><rect x="915" y="490" width="430" height="65" rx="10" fill="#fff6e8" stroke="#ec7211" stroke-width="1.6"/><rect x="915" y="490" width="5" height="65" rx="2" fill="#ec7211" opacity="0.9"/><text x="1130" y="519" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#5c2c00">src/resources/</text><text x="1130" y="538" text-anchor="middle" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#414d5c">waitFor, typed reports</text></g><text x="30" y="645" text-anchor="start" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#414d5c">src/architecture.test.ts fails the build if a layer imports the wrong way. The SDK has zero runtime dependencies and uses fetch.</text><text x="1376" y="646" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8d99a8">Enterprise Agent Factory Service · website-architecture</text></svg>
