info:
  description: Control plane API of the Enterprise Agent Factory Service (afs-api). Machine-readable form of the root repository's docs/contracts/api-contract.md v1.4.0; once an operation is here, this document wins. Role-based access is enforced on every operation (x-afs-permission, x-afs-scope).
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: Enterprise Agent Factory Service API
  version: 1.4.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: GetHealth
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        "200":
          content:
            application/json:
              example:
                status: ok
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Success
          headers:
            X-Afs-Contract-Version:
              $ref: '#/components/headers/XAfsContractVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/Throttled'
        "500":
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Get health
      tags:
        - admin
      x-afs-cli: none (not a CLI operation)
      x-afs-csv: false
      x-afs-events: []
      x-afs-permission: none
      x-afs-priority: P0
      x-afs-scope: public
      x-afs-screen: none
      x-afs-sdk: health.get()
  /readyz:
    get:
      operationId: GetReadiness
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        "200":
          content:
            application/json:
              example:
                checks:
                  database: ok
                  schema: ok
                status: ready
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Success
          headers:
            X-Afs-Contract-Version:
              $ref: '#/components/headers/XAfsContractVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        "400":
          $ref: '#/components/responses/BadRequest'
        "429":
          $ref: '#/components/responses/Throttled'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          content:
            application/json:
              example:
                checks:
                  database: unavailable
                  schema: ok
                status: not ready
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: A dependency is not ready. Each failing check reports only the word unavailable; the cause is logged with the request id
          headers:
            X-Afs-Contract-Version:
              $ref: '#/components/headers/XAfsContractVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
      security: []
      summary: Get readiness
      tags:
        - admin
      x-afs-cli: none (not a CLI operation)
      x-afs-csv: false
      x-afs-events: []
      x-afs-permission: none
      x-afs-priority: P0
      x-afs-scope: public
      x-afs-screen: none
      x-afs-sdk: health.getReadiness()
  /v1/admin/agent-templates:
    get:
      operationId: ListAdminAgentTemplates
      parameters:
        - $ref: '#/components/parameters/MaxResults'
        - $ref: '#/components/parameters/NextToken'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        "200":
          content:
            application/json:
              example:
