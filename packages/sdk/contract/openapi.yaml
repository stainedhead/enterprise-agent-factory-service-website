                    default: afs
                    key: secrets.path_prefix
                    pattern: ^[a-z][a-z0-9-]{0,30}$
                    type: string
                    updatedAt: null
                    value: afs
                    version: 1
                  - allowed: boolean
                    default: true
                    key: pricing.price_list_sync
                    type: boolean
                    updatedAt: null
                    value: true
                    version: 1
                  - allowed: 0 to 100
                    default: 5
                    key: billing.variance_alert_pct
                    max: 100
                    min: 0
                    type: integer
                    updatedAt: null
                    value: 5
                    version: 1
                  - allowed: 60 to 604800
                    default: 3600
                    key: api.idempotency_key_ttl_seconds
                    max: 604800
                    min: 60
                    type: integer
                    updatedAt: null
                    value: 3600
                    version: 1
                  - allowed: 1 to 365
                    default: 90
                    key: teams.ephemeral_max_days
                    max: 365
                    min: 1
                    type: integer
                    updatedAt: null
                    value: 90
                    version: 1
                  - allowed: 1 to 720
                    default: 48
                    key: work_orders.sla_warning_hours
                    max: 720
                    min: 1
                    type: integer
                    updatedAt: null
                    value: 48
                    version: 1
                  - allowed: boolean; setting it to `true` is how S9's banner is acknowledged
                    default: false
                    key: billing.tag_activation_acknowledged
                    type: boolean
                    updatedAt: null
                    value: false
                    version: 1
                  - allowed: null, or the id (`nch_<ulid>`) of a service-level email channel
                    default: null
                    key: work_orders.notification_channel_id
                    nullable: true
                    pattern: ^nch_[0-9A-HJKMNP-TV-Z]{26}$
                    type: string
                    updatedAt: null
                    value: null
